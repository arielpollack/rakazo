<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rakazo · Quick connect design</title>
<style>
:root{color-scheme:light dark;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--foreground,CanvasText);--tile:var(--card,light-dark(#fff,#242425));--soft:var(--secondary,light-dark(#f3f3f5,#353537));--edge:var(--border,light-dark(#dedee2,#464649));--text:var(--foreground,CanvasText);--sub:var(--muted-foreground,light-dark(#555760,#c0c0c6));--ok:var(--success,light-dark(#276542,#87caa2));--alert:var(--warning,light-dark(#8c4503,#f4b768))}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible,[tabindex="-1"]:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}.filter,.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.filter{margin:0 0 12px}.filter label,.foot{font-size:12px;color:var(--sub)}select,.action,.confirm,.more,.dismiss{background:var(--soft);border:1px solid var(--edge);border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:var(--tile);border:1px solid var(--edge);border-radius:10px;padding:16px;min-height:152px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.identity{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;object-fit:contain}.title,.subtle{background:none;border:0;padding:0}.title{font-weight:650;text-align:left;font-size:15px}.title:hover{text-decoration:underline}.chevron{color:var(--sub);font-size:15px;font-weight:400}.meta,.status{font-size:12px}.meta,.description{color:var(--sub)}.description{margin:0;font-size:13px;line-height:1.4}.slot{margin-top:auto;display:flex;align-items:center;min-height:26px}.action,.status{display:inline-flex;gap:5px;align-items:center}.action{min-height:26px}.action:hover,.more:hover,.dismiss:hover{filter:brightness(.95)}.action svg{width:13px;height:13px}.status{color:var(--ok);font-weight:550}.waiting{color:var(--sub)}.error{color:var(--alert)}.foot{margin-top:12px}.subtle{font-size:12px;text-decoration:underline;color:var(--sub)}dialog{color:var(--text);background:var(--tile);border:1px solid var(--edge);border-radius:12px;padding:20px;max-width:min(352px,90%);box-shadow:0 8px 40px #0002}dialog::backdrop{background:#0004}dialog h2{margin:6px 0;font-size:20px}dialog p{margin:6px 0 16px;font-size:14px;color:var(--sub)}.buttons{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}.confirm{background:var(--text);color:var(--tile)}.demo-label{font-size:12px;color:var(--sub)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}.tile{min-height:140px}}@media(prefers-color-scheme:dark){.mark.mono{filter:invert(1)}}
.tile{position:relative}.title::after{content:"";position:absolute;inset:0;border-radius:10px}.tile:hover{background:color-mix(in srgb,var(--tile),currentColor 5.5%);border-color:color-mix(in srgb,var(--tile),currentColor 34%)}.title:hover{text-decoration:none}.title:focus-visible{outline:0}.title:focus-visible::after{outline:2px solid var(--ring,Highlight);outline-offset:-2px}.tile .action{position:relative;z-index:1}
</style></head><body>
<main aria-label="Quick-connect marketplace prototype"><div class="filter"><label for="type">Explore integrations</label><select id="type"><option>All types</option><option>Apps</option><option>Plugins</option><option>MCP servers</option></select></div><div class="grid" id="grid"></div><div class="foot"><span>Local design prototype · no accounts are used.</span><button class="more" id="more">Show more integrations</button><button class="subtle" id="reset" hidden>Reset demo</button></div></main>
<div role="status" class="sr" id="announce"></div><dialog aria-labelledby="heading"><span class="demo-label" id="kicker"></span><h2 id="heading"></h2><p id="explanation"></p><div class="buttons"><button class="subtle" id="failure">Simulate failure</button><button class="dismiss" id="cancel">Cancel</button><button class="confirm" id="primary"></button></div></dialog>
<script>
const listings=[
 ['gmail','Gmail','App','Email','Find email threads and draft replies in your mailbox.','gmail','Connected · Team inbox'],
 ['slack','Slack','App','Communication','Find channels and read recent conversations.','slack'],
 ['drive','Google Drive','App','Files & docs','Look up shared files and folders in Drive.','google-drive'],
 ['figma','Figma','Plugin','Design','Look up design files and their comments.','figma'],
 ['linear','Linear','MCP server','linear.app','Work with issues and projects through a bot.','linear','Configured · 23 tools'],
 ['notion','Notion','App','Productivity','Find a page or database in your workspace.','notion'],
 ['calendar','Google Calendar','App','Productivity','Find events and check what’s on your calendar.','google-calendar'],
 ['asana','Asana','MCP server','asana.com','Work with tasks and projects in Asana.','asana'],
 ['slack-server','Slack','MCP server','slack.com','Make Slack tools available to configure for a bot.','slack']
].map(([id,name,type,category,description,mark,initial])=>({id,name,type,category,description,mark,initial}));
const byId=id=>document.getElementById(id), grid=byId('grid'), dialog=document.querySelector('dialog'), primary=byId('primary'), cancel=byId('cancel'), fail=byId('failure'), resets=byId('reset'), more=byId('more'), filter=byId('type');
const states=new Map(), types={'Apps':'App','Plugins':'Plugin','MCP servers':'MCP server'};let active=null, expanded=false, stage=null, origin=null, previous=null;
const verb=item=>item.type==='App'?`Connect ${item.name}`:item.type==='Plugin'?`Install ${item.name}`:`Add ${item.name} server`;
const completed=item=>item.type==='App'?'Connected · Design team':item.type==='Plugin'?'Installed':'Configured';
const pending=item=>item.type==='App'?`Waiting for ${item.name}…`:item.type==='Plugin'?'Waiting for installation…':'Waiting for setup…';
const icon=type=>`<svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">${type==='App'?'<path d="m6.5 9.5 3-3m-2.1-1 1.7-1.7a2.8 2.8 0 0 1 4 4l-2 2m-2.5.7-1.7 1.7a2.8 2.8 0 0 1-4-4l2-2"/>':'<path d="M8 3v10M3 8h10"/>'}</svg>`;
function paint(){const selected=types[filter.value];const shown=selected?listings.filter(item=>item.type===selected):expanded?listings:listings.slice(0,6);grid.innerHTML=shown.map(item=>{const state=states.get(item.id);const done=item.initial||(state==='success'&&completed(item));const label=state==='error'?`Retry ${item.name}`:verb(item);return `<article class="tile" aria-label="${item.name} ${item.type}"><div class="identity"><img alt="" class="mark ${item.mark==='linear'?'mono':''}" width="38" height="38" src="Marketplace-assets/Brandmarks/${item.mark}.png"><div><button id="detail-${item.id}" class="title" data-detail="${item.id}" aria-label="${item.name} ${item.type} details">${item.name} <span class="chevron" aria-hidden="true">›</span></button><div class="meta">${item.type}${item.initial?'':' · '+item.category}</div></div></div><p class="description ${state==='error'?'error':''}">${state==='error'?'Couldn’t finish setup. Try again.':item.description}</p><div class="slot">${done?`<span class="status" id="status-${item.id}" tabindex="-1"><span aria-hidden="true">✓</span> ${done}</span>`:state==='pending'?`<span class="status waiting" aria-busy="true">${pending(item)}</span>`:`<button class="action" id="action-${item.id}" data-action="${item.id}">${icon(item.type)}${label}</button>`}</div></article>`}).join('');more.hidden=!!selected||expanded;resets.hidden=!states.size;}
function say(message){byId('announce').textContent=message}
function sheet(item,mode){active=item;stage=mode;const isDetail=mode==='detail';byId('kicker').textContent=isDetail?`${item.type} details`:'Simulated setup · no external access';byId('heading').textContent=isDetail?item.name:verb(item);const done=item.initial||states.get(item.id)==='success';byId('explanation').textContent=isDetail?item.description:item.type==='App'?`Approve a sample ${item.name} connection for the Design team workspace. No bot permissions change.`:item.type==='Plugin'?`Confirm a sample installation of the ${item.name} plugin. No account is linked.`:`Confirm setup of the sample ${item.name} server. This does not give any bot access.`;fail.hidden=isDetail;cancel.textContent=isDetail?'Back':'Cancel';primary.hidden=isDetail&&!!done;primary.textContent=isDetail?verb(item):item.type==='App'?'Approve sample':item.type==='Plugin'?'Confirm install':'Confirm setup';if(!dialog.open)dialog.showModal();cancel.focus({preventScroll:true})}
function begin(item){if(states.get(item.id)==='pending')return;previous=states.get(item.id);states.set(item.id,'pending');paint();say(pending(item));sheet(item,'setup')}
function finish(outcome){if(!active)return;const item=active;if(stage==='setup'){if(outcome==='cancel'){if(previous)states.set(item.id,previous);else states.delete(item.id)}else states.set(item.id,outcome);paint();say(outcome==='success'?`${item.name}: ${completed(item)}`:outcome==='error'?`Setup failed. Retry ${item.name}.`:'Setup cancelled.')}dialog.close();const focusId=stage==='detail'?`detail-${item.id}`:outcome==='success'?`status-${item.id}`:origin;active=null;stage=null;byId(focusId)?.focus({preventScroll:true})}
grid.addEventListener('click',event=>{const trigger=event.target.closest('button');if(!trigger)return;const item=listings.find(entry=>entry.id===(trigger.dataset.action||trigger.dataset.detail));if(!item)return;origin=trigger.id;if(trigger.dataset.detail)sheet(item,'detail');else begin(item)});
primary.onclick=()=>{if(stage==='detail')begin(active);else finish('success')};cancel.onclick=()=>finish('cancel');fail.onclick=()=>finish('error');dialog.addEventListener('cancel',event=>{event.preventDefault();finish('cancel')});more.onclick=()=>{expanded=true;paint();byId('detail-calendar').focus({preventScroll:true})};filter.onchange=()=>{expanded=false;paint()};resets.onclick=()=>{states.clear();paint();filter.focus({preventScroll:true});say('Sample connections reset.')};paint();
</script></body></html>

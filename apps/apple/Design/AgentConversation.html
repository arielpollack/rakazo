<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Chief · Rakazo conversation design</title>
  <style>
    :root { color-scheme:light dark; --ui:var(--font-sans,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif); --paper:light-dark(#fff,#191919); --ink:light-dark(#242321,#f4f2ee); --secondary-ink:light-dark(#696660,#bab5ac); --tertiary-ink:light-dark(#706d67,#aaa69f); --line:light-dark(#e7e5e1,#383632); --fill:light-dark(#f5f4f2,#282724); --strong-fill:light-dark(#ebe8e4,#3a3732); --artifact-tint:light-dark(#faeee2,#3b2c22); --outgoing:#f16b00; --action:light-dark(#964112,#ffac72); --avatar:#ff781c; --good:light-dark(#34705a,#93c8ad); --failure:light-dark(#993c31,#f2a399); --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --bubble:17px; --tile:13px; --hair:1px solid var(--line); }
    * { box-sizing:border-box } html,body { margin:0; padding:0; background:transparent; font-family:var(--ui) } body { color:var(--foreground,var(--ink)) } button,select,input { font:inherit; color:inherit } button,summary,label { -webkit-tap-highlight-color:transparent } button,summary,select { cursor:pointer; touch-action:manipulation } button { border:0; background:none; padding:0 } button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--action); outline-offset:3px } button:disabled { cursor:default } button:active:not(:disabled) { opacity:.76 }
    .review { max-width:840px; margin-inline:auto; min-width:0 } .window { background:var(--paper); color:var(--ink); font:400 16px/1.45 var(--ui); -webkit-font-smoothing:antialiased } .symbol { width:18px; height:18px; flex:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; fill:none } .defs { position:absolute; width:0; height:0; pointer-events:none } .sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; clip-path:inset(50%); overflow:hidden; white-space:nowrap }
    .mast { min-height:66px; display:flex; align-items:center; gap:11px; padding:10px var(--s6); border-bottom:var(--hair) } .face { display:block; width:38px; height:38px; flex:none } .mast-text { display:grid; line-height:1.22 } .mast-text b { font-size:17px; letter-spacing:-.02em } .mast-text small,.sub { color:var(--secondary-ink); font-size:13px } .mast-text small { margin-top:2px } .mast .types { margin-left:auto } .types,.replay { min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:6px; color:var(--secondary-ink); font-size:13px; font-weight:550; border-radius:9px; padding:0 8px } .types:hover,.replay:hover,.activity summary:hover,.settled:hover { background:var(--fill); color:var(--ink) } .types .symbol,.replay .symbol { width:16px; height:16px }
    .history { height:500px; overflow:auto; overscroll-behavior-y:contain; scrollbar-color:var(--strong-fill) transparent; scrollbar-width:thin; padding:20px clamp(16px,4.5%,40px) 24px; scroll-padding-block:16px } .thread { max-width:655px; margin:0 auto; display:flex; flex-direction:column; gap:20px } .day { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--tertiary-ink); font-size:12px; font-weight:550; font-variant-numeric:tabular-nums } .day i,.middle-dot { width:2px; height:2px; background:currentColor; border-radius:50%; flex:none } .user-line { display:flex; justify-content:flex-end; padding-left:14% } .outgoing { max-width:39ch; width:fit-content; padding:10px 15px; background:var(--outgoing); color:#fff; border-radius:var(--bubble) var(--bubble) 6px var(--bubble); line-height:1.44; overflow-wrap:anywhere }
    .response { display:grid; grid-template-columns:24px minmax(0,1fr); align-items:start; gap:9px; max-width:60ch } .response .face { width:24px; height:24px } .author { display:flex; align-items:center; gap:8px; min-height:24px; margin:0 0 6px; line-height:1.1 } .author strong { font-size:13px; font-weight:660 } .author time { font-size:11.5px; color:var(--tertiary-ink); font-variant-numeric:tabular-nums } .prose { max-width:55ch; line-height:1.48; letter-spacing:-.009em; overflow-wrap:anywhere } .prose p { margin:0 } .prose p+p,.prose ul { margin:8px 0 0 } .prose strong { font-weight:640 } .prose ul { padding-left:1.15em } .prose li { margin:3px 0; padding-left:2px } .prose li::marker { color:var(--tertiary-ink); font-size:.75em } .section-title { display:block; font-size:19px; line-height:1.3; font-weight:670; letter-spacing:-.027em; margin:0 0 5px }
    .activity { margin:0 0 10px; color:var(--secondary-ink); font-size:13px } summary { list-style:none } summary::-webkit-details-marker { display:none } .activity summary,.settled { display:flex; align-items:center; gap:7px; width:fit-content; max-width:100%; min-height:30px; border-radius:7px; padding:2px 5px; margin-left:-5px; line-height:1.3 } .activity summary .symbol { width:15px; height:15px } .activity summary .caret { width:12px; height:12px; transition:transform .16s ease } .activity[open] summary .caret { transform:rotate(90deg) } .activity .duration { font-variant-numeric:tabular-nums } .steps { list-style:none; margin:1px 0 10px 7px; padding:2px 0 2px 14px; border-left:var(--hair) } .steps li { display:flex; align-items:center; gap:8px; min-height:29px; font-size:13px } .steps .symbol { width:14px; height:14px } .steps .done { color:var(--good) } .steps .live { color:var(--action) } .steps .wait { color:var(--tertiary-ink) } .step-state { margin-left:auto; padding-left:12px; font-size:12px; color:var(--secondary-ink) } .work-area { max-width:380px; margin-top:12px } .work-area .activity { margin:0 } .stage { min-height:269px } .writing { display:flex; align-items:center; gap:8px; min-height:32px; color:var(--secondary-ink); font-size:14px } .dots { display:inline-flex; align-items:center; gap:3px; height:12px } .dots i { width:4px; height:4px; border-radius:50%; background:var(--action); animation:blink 1.3s ease-in-out infinite } .dots i:nth-child(2) { animation-delay:.14s } .dots i:nth-child(3) { animation-delay:.28s } @keyframes blink { 0%,70%,100% {opacity:.45} 35% {opacity:1;transform:translateY(-2px)} } .spin { animation:rotate 1.1s linear infinite } @keyframes rotate { to {transform:rotate(360deg)} }
    .object { display:flex; align-items:center; gap:12px; width:100%; max-width:355px; min-height:66px; padding:10px 12px; border:var(--hair); border-radius:var(--tile); background:var(--paper); text-align:left } .object:hover,.pick:hover,.secondary-btn:hover { background:var(--fill) } .document { display:grid; place-items:center; flex:none; width:38px; height:42px; border-radius:8px; color:var(--action); background:var(--artifact-tint) } .document .symbol { width:23px; height:23px } .object-copy { display:grid; flex:1; line-height:1.35; min-width:0 } .object-copy b { font-size:14px; font-weight:620; overflow-wrap:anywhere } .object-copy small { color:var(--secondary-ink); font-size:12px; margin-top:2px } .object>.symbol:last-child { width:14px; height:14px; color:var(--secondary-ink) } .artifact { margin-top:14px }
    .request { max-width:390px; margin-top:12px; border:var(--hair); border-radius:var(--tile); padding:var(--s4); background:var(--paper) } .request-head,.notice,.receipt { display:flex; align-items:center; gap:8px; color:var(--secondary-ink); font-size:13px } .request-head { font-weight:600; margin-bottom:9px } .request-head .symbol { color:var(--action) } .request h2,.sample h3 { margin:0; color:var(--ink); font-size:16px; font-weight:630; letter-spacing:-.018em } .request p,.sample p { margin:4px 0 0; font-size:14px; line-height:1.45; color:var(--secondary-ink) } .actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px } .primary-btn,.secondary-btn { min-height:36px; border-radius:9px; padding:6px 12px; font-size:13px; font-weight:610 } .primary-btn { background:var(--ink); color:var(--paper) } .secondary-btn { border:var(--hair); color:var(--ink) } .inline-btn { min-height:34px; width:fit-content; padding:2px 4px; margin-left:-4px; color:var(--action); font-size:13px; font-weight:580; border-radius:6px } .inline-btn:hover { text-decoration:underline } .receipt { margin-top:10px } .receipt .symbol { color:var(--good); width:15px; height:15px } .warning { color:var(--failure) }
    .preview-tools { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; border-top:var(--hair); background:var(--paper); padding:12px var(--s6); font-size:13px } .preview-label { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:580; color:var(--secondary-ink) } .preview-label .symbol { width:15px; height:15px } .phase-tabs { display:flex; padding:3px; gap:2px; border-radius:10px; background:var(--fill); max-width:100% } .phase-tabs button { white-space:nowrap; flex:1; padding:6px 11px; min-height:30px; font-size:13px; font-weight:550; letter-spacing:-.01em; border-radius:7px; color:var(--secondary-ink) } .phase-tabs button[aria-selected=true] { color:var(--ink); background:var(--paper); box-shadow:0 1px 3px #0002 } .phase-tabs button:hover:not([aria-selected=true]) { color:var(--ink) } .replay { margin-left:auto }
    dialog { color:var(--ink); background:var(--paper); border:var(--hair); border-radius:18px; width:min(440px,calc(100% - 28px)); max-height:calc(100% - 32px); overflow:auto; padding:0; box-shadow:0 12px 54px #0002; font:400 15px/1.45 var(--ui) } dialog::backdrop { background:#17141044 } .sheet-top { position:sticky; top:0; background:var(--paper); display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 16px 10px; border-bottom:var(--hair); z-index:1 } .sheet-top h2 { margin:0; font-size:16px; letter-spacing:-.015em } .x { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--fill) } .x .symbol { width:15px; height:15px } .sheet-body { padding:var(--s4) } .sheet-intro { margin:0 0 12px; font-size:13px; color:var(--secondary-ink) } .choice-list { display:grid; gap:6px } .pick { display:flex; align-items:center; gap:10px; min-height:44px; border:var(--hair); border-radius:9px; padding:8px 10px; cursor:pointer; overflow-wrap:anywhere } .pick input { accent-color:var(--action); width:16px; height:16px; flex:none } .pick b { font-weight:560 } .pick small { display:block; color:var(--secondary-ink); font-size:12px } .picker-label { display:block; margin-bottom:6px; color:var(--secondary-ink); font-size:12px; font-weight:600 } select { width:100%; padding:8px; min-height:40px; border:var(--hair); background:var(--fill); border-radius:9px } .sample { padding:16px 0 4px } .sample .request,.sample .object { max-width:none; margin-top:0 } .sample .request+.request,.sample .object+.object { margin-top:10px } .sample .writing { margin:8px 0 } .sample .keys { display:grid; grid-template-columns:1fr auto; gap:8px; margin:8px 0 0; font-size:14px } .keys dt { color:var(--secondary-ink) } .keys dd { margin:0; font-weight:600 } .bar-row { display:grid; grid-template-columns:60px minmax(0,1fr) 26px; align-items:center; gap:10px; font-size:13px; margin-top:10px; font-variant-numeric:tabular-nums } .bar { background:var(--fill); height:8px; border-radius:8px } .bar i { display:block; width:var(--value); background:var(--action); height:100%; border-radius:inherit } .chart-note { font-size:12px; color:var(--secondary-ink); margin-top:10px } .page-copy { padding:4px; overflow-wrap:anywhere } .page-copy h3 { font-size:23px; letter-spacing:-.035em; line-height:1.2; margin:12px 0 8px } .page-copy h4 { margin:16px 0 3px; font-size:15px } .page-copy p { margin:4px 0 } .page-copy ul { padding-left:20px; margin:4px 0 }
    @media(max-width:550px) { .mast { padding-inline:16px } .history { height:525px; padding-inline:14px } .preview-tools { padding:10px 14px; gap:5px 10px } .phase-tabs { order:3; width:100% } .phase-tabs button { min-height:38px; padding-inline:5px } .replay,.types,.x,.primary-btn,.secondary-btn,.inline-btn,.activity summary { min-height:44px } .x { width:44px } .replay,.types { padding-inline:4px } .thread { gap:17px } .outgoing { font-size:16px; padding:10px 13px } .response { grid-template-columns:21px minmax(0,1fr); gap:6px } .response .face { width:21px; height:21px } .prose { font-size:17px } .step-state { padding-left:2px } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important } }
  </style>
</head>
<body>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="chief" viewBox="0 0 32 32"><path fill="var(--avatar)" d="M1.7 17.1C.9 9.5 7.2 2.2 15 2c8.2-.4 15 5.2 15.1 12.9.2 8.1-6.2 15.2-14 15.5C7.6 30.9 2.5 25.3 1.7 17.1Z"/><path d="m12.6 13.2-.2 5.1m7-5.2-.2 5.1" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="layers" viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="3"/><path d="M9 20h8a3 3 0 0 0 3-3V9"/></symbol>
    <symbol id="steps" viewBox="0 0 24 24"><path d="M9 6h11M9 12h8M9 18h10"/><path d="m3 6 1.1 1.1L6 4.8m-3 7.3 1.1 1.1L6 10.8m-3 7.3 1.1 1.1L6 16.8"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol><symbol id="dots" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></symbol><symbol id="spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" opacity=".22"/><path d="M12 4a8 8 0 0 1 8 8"/></symbol>
    <symbol id="page" viewBox="0 0 24 24"><path d="M5 4a1.5 1.5 0 0 1 1.5-1.5H14L19 7.7v12a1.7 1.7 0 0 1-1.7 1.8H6.7A1.7 1.7 0 0 1 5 19.8Z"/><path d="M14 3v5h4.8M8.5 12h7M8.5 15.7h5"/></symbol>
    <symbol id="monitor" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="M12 18v3m-4 0h8"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.2 7M4 4v6h6"/></symbol><symbol id="sliders" viewBox="0 0 24 24"><path d="M3 7h6m4 0h8M3 17h10m4 0h4"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
    <symbol id="branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M6 7.5v9M6 15c1-4 12 0 12-5.5"/></symbol><symbol id="circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4m0 3h.01"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="phone" viewBox="0 0 24 24"><path d="m5 3 3.5-.2 2 5.1-2.1 2a13.8 13.8 0 0 0 5.7 5.7l2-2.1 5 2-.1 3.6a2.1 2.1 0 0 1-2.3 2C10.5 20.5 3.5 13.5 3 5.3A2.1 2.1 0 0 1 5 3Z"/></symbol><symbol id="chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 15v-4m5 4V7m5 8v-6"/></symbol><symbol id="link" viewBox="0 0 24 24"><path d="m10 14 4-4m-5-1 2-2a5 5 0 0 1 7 7l-2 2m-1-1-2 2a5 5 0 0 1-7-7l2-2"/></symbol>
  </defs></svg>
  <main class="review"><section class="window" aria-label="Rakazo conversation design preview">
    <header class="mast"><svg class="face" aria-hidden="true"><use href="#chief"/></svg><div class="mast-text"><b>Chief</b><small>Personal workspace</small></div><button class="types" id="library" aria-haspopup="dialog"><svg class="symbol" aria-hidden="true"><use href="#layers"/></svg>Message types</button></header>
    <div id="history" class="history" aria-label="Sample conversation" tabindex="0"><div class="thread">
      <div class="day">Today<i aria-hidden="true"></i><time>9:41 AM</time></div>
      <div class="user-line" aria-label="You"><div class="outgoing">Turn the team review notes into a one-page brief. What should we decide first?</div></div>
      <article class="response"><svg class="face" aria-hidden="true"><use href="#chief"/></svg><div><div class="author"><strong>Chief</strong><time id="time">9:42</time></div><div class="stage" id="stage" role="tabpanel" tabindex="0" aria-labelledby="tab-ready"></div></div></article>
    </div></div>
    <footer class="preview-tools"><span class="preview-label"><svg class="symbol" aria-hidden="true"><use href="#sliders"/></svg>Preview state</span><div class="phase-tabs" id="tabs" role="tablist" aria-label="Preview run state"><button id="tab-writing" data-phase="writing" role="tab" aria-controls="stage" aria-selected="false" tabindex="-1">Writing</button><button id="tab-working" data-phase="working" role="tab" aria-controls="stage" aria-selected="false" tabindex="-1">Working</button><button id="tab-pending" data-phase="pending" role="tab" aria-controls="stage" aria-selected="false" tabindex="-1">Needs you</button><button id="tab-ready" data-phase="ready" role="tab" aria-controls="stage" aria-selected="true">Result</button></div><button id="replay" class="replay"><svg class="symbol" aria-hidden="true"><use href="#back"/></svg><span>Replay</span></button></footer>
    <p role="status" aria-live="polite" class="sr" id="announce"></p>
  </section></main>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-top"><h2 id="sheet-title"></h2><button class="x" data-cmd="close" aria-label="Close"><svg class="symbol" aria-hidden="true"><use href="#close"/></svg></button></div><div class="sheet-body" id="sheet-body"></div></dialog>
  <script>
    (() => {
      const byId = id => document.getElementById(id);
      const symbol = (name, extra = '') => `<svg class="symbol ${extra}" aria-hidden="true"><use href="#${name}"/></svg>`;
      const action = (cmd, label, style = 'secondary-btn') => `<button type="button" class="${style}" data-cmd="${cmd}">${label}</button>`;
      const object = (cmd, name, detail) => `<button type="button" class="object" data-cmd="${cmd}" aria-haspopup="dialog"><span class="document">${symbol('page')}</span><span class="object-copy"><b>${name}</b><small>${detail}</small></span>${symbol('chevron')}</button>`;
      const head = (icon, label) => `<div class="request-head">${symbol(icon)}${label}</div>`;
      const receipt = text => `<div class="receipt">${symbol('check')}${text}</div>`;
      const names = { writing:'Writing', working:'Working', pending:'Needs you', ready:'Result', stopped:'Stopped' };
      const phases = ['writing','working','pending','ready'];
      const tabs = [...byId('tabs').querySelectorAll('button')];
      const state = { phase:'ready', stoppedAt:'working', file:'Final notes', handoff:'selected', replay:false, sample:'choice', answers:{}, focusCmd:null };
      let timer;
      function activity(phase) {
        const done = phase === 'ready';
        const stopped = phase === 'stopped';
        const pending = phase === 'pending';
        const rows = done ? [['Read the team notes','Done'],[state.handoff === 'skipped' ? 'Skipped the extra file' : `Read ${state.file.toLowerCase()}` ,state.handoff === 'skipped' ? 'Skipped':'Done'],['Saved the brief','Done']] : [['Read the team notes','Done'],['Find the latest review',stopped?'Stopped':pending?'Needs you':'Running']];
        const title = done ? '3 actions' : stopped ? 'Run stopped' : pending ? 'Waiting for a file' : 'Finding the latest review';
        return `<details class="activity" ${phase === 'working' ? 'open':''}><summary>${symbol(done || stopped ? 'steps':pending?'monitor':'spin',phase==='working'?'spin live':'')}<span>${title}</span>${done?'<i class="middle-dot" aria-hidden="true"></i><span class="duration">8s</span>':''}${symbol('chevron','caret')}</summary><ol class="steps">${rows.map(([text,status])=>`<li>${symbol(status==='Done'?'check':status==='Running'?'spin':status==='Needs you'?'monitor':'dots',status==='Done'?'done':status==='Running'?'spin live':'wait')}<span>${text}</span><span class="step-state">${status}</span></li>`).join('')}</ol></details>`;
      }
      function render(announce = true) {
        const phase=state.phase, selected=phase==='stopped'?state.stoppedAt:phase;
        tabs.forEach(tab=>{const active=tab.dataset.phase===selected;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1});
        byId('stage').setAttribute('aria-labelledby','tab-'+selected); byId('time').textContent=phase==='ready'?'9:42':'9:41';
        byId('replay').lastElementChild.textContent=state.replay?'Pause':'Replay';
        byId('replay').setAttribute('aria-label',state.replay?'Pause sample replay':'Replay sample run');
        const intro='<div class="prose"><p>I’ll check the notes for the decision, the evidence behind it, and who owns the next step.</p></div>';
        let html;
        if(phase==='writing') html=`<div class="writing"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>Writing…</div>${action('stop','Stop response','inline-btn')}`;
        if(phase==='working') html=`${intro}<div class="work-area">${activity('working')}</div>${action('stop','Stop run','inline-btn')}`;
        if(phase==='pending') html=`${intro}<div class="request">${head('monitor','Computer · Needs you')}<h2>Which notes are final?</h2><p>I found two versions of the review. Pick one on my computer, or I can use just the notes already in this chat.</p><div class="actions">${action('computer','Open computer','primary-btn')}${action('skip','Skip')}</div></div>`;
        if(phase==='stopped') html=`${state.stoppedAt==='working'?intro+'<div class="work-area">'+activity('stopped')+'</div>':'<div class="notice">'+symbol('circle')+'Response stopped</div>'}${action('retry','Try again','inline-btn')}`;
        if(phase==='ready') html=`${activity('ready')}<div class="prose"><h2 class="section-title">Keep the pilot small.</h2><p>${state.handoff==='skipped'?'From the notes in this chat, the first decision is whether to fix invites before opening the pilot to more teams.':state.file==='Workshop notes'?'The workshop notes point to one decision: fix invites before opening the pilot to more teams.':'Both pilot teams stalled at the invite step. I’d fix that before bringing more teams in.'}</p><ul><li><strong>Next step:</strong> Maya revises the invite flow.</li><li><strong>Friday:</strong> Lee tests it with both teams.</li></ul></div><div class="artifact">${object('page','Team review brief','Rakazo page · Version 1')}</div>`;
        byId('stage').innerHTML=html;
        if(announce) byId('announce').textContent=phase==='pending'?'Chief needs you to choose a file.':phase==='ready'?'Chief’s brief is ready.':names[phase];
      }
      function cancelReplay(){clearTimeout(timer);state.replay=false}
      function phaseTo(phase, focus=false){cancelReplay();state.phase=phase;render();byId('history').scrollTop=0;if(focus)tabs.find(tab=>tab.dataset.phase===phase)?.focus()}
      function replayStep(){
        if(!state.replay)return;
        if(state.phase==='writing'){state.phase='working';render();timer=setTimeout(replayStep,2400)}
        else if(state.phase==='working'){phaseTo('pending');if(document.activeElement===byId('replay')) byId('stage').focus({preventScroll:true})}
      }
      function replay(){if(state.replay){cancelReplay();render(false);return}state.handoff='selected';state.file='Final notes';state.phase='writing';state.replay=true;byId('history').scrollTop=0;render();timer=setTimeout(replayStep,1700)}
      const sheet=byId('sheet');
      function showSheet(title,content,returnCmd){
        cancelReplay();byId('replay').lastElementChild.textContent='Replay';byId('replay').setAttribute('aria-label','Replay sample run');
        byId('sheet-title').textContent=title;byId('sheet-body').innerHTML=content;
        if(!sheet.open){state.focusCmd=returnCmd;sheet.showModal()}sheet.scrollTop=0;
      }
      function closeSheet(){if(sheet.open)sheet.close()}
      sheet.addEventListener('close',()=>{const target=state.focusCmd==='library'?byId('library'):document.querySelector(`#stage [data-cmd="${state.focusCmd}"]`);(target||byId('stage')).focus({preventScroll:true});state.focusCmd=null});
      function computer(){showSheet('Chief’s computer',`<p class="sheet-intro">Sample computer · choose the file to hand back to Chief. This is not a live desktop.</p><fieldset style="border:0;padding:0;margin:0"><legend class="picker-label">Review folder</legend><div class="choice-list">${['Final notes','Workshop notes'].map((file,index)=>`<label class="pick"><input type="radio" name="file" value="${file}" ${index===0?'checked':''}>${symbol('page')}<span><b>${file}.md</b><small>${index===0?'Edited today':'Edited yesterday'}</small></span></label>`).join('')}</div></fieldset><div class="actions">${action('use-file','Hand back to Chief','primary-btn')}${action('close','Cancel')}</div>`,'computer')}
      function page(){showSheet('Saved page',`<div class="page-copy"><div class="sub">Personal workspace · Version 1</div><h3>Team review brief</h3><h4>Decision</h4><p>Fix the invite step before expanding the pilot.</p><h4>What we heard</h4><p>Both teams could create a workspace, but neither team finished inviting a colleague unaided.</p><h4>Owners</h4><ul><li>Maya revises the invite flow.</li><li>Lee watches both teams try it on Friday.</li></ul><h4>Source</h4><p>${state.handoff==='skipped'?'Notes already in this chat.':state.file+'.md'}</p></div>`,'page')}
      const examples = {choice:'Choice',approval:'Approval',connection:'App connection',question:'Tool question',delegate:'Delegated work',relay:'Bot handoff',call:'Voice call',chart:'Chart',card:'Structured result',failure:'Failed action'};
      const box = (icon,label,title,detail,controls='') => `<div class="request">${head(icon,label)}<h3>${title}</h3><p>${detail}</p>${controls}</div>`;
      function example(){
        const kind=state.sample,answer=state.answers[kind];
        const picks=(choices)=>`<div class="actions">${choices.map(([cmd,label],index)=>action(cmd,label,index===0?'primary-btn':'secondary-btn')).join('')}</div>`;
        const decision=(choices)=>answer?receipt(answer):picks(choices);
        if(kind==='choice') return box('layers','Choice','Who is this brief for?','I’ll adjust how much background I include.',decision([['opt-team','Pilot team'],['opt-leads','Team leads']]));
        if(kind==='approval') return box('lock','Approval','Save this as a weekly routine?','Chief would prepare a fresh brief every Friday. Nothing is scheduled in this preview.',decision([['allow','Save routine'],['decline','Not now']]));
        if(kind==='connection') return box('link','App connection','Connect Calendar','Chief needs a calendar connection to check the next review date.',decision([['connect','Preview connected state']]));
        if(kind==='question') return box('lock','Tool question','Include archived reviews?','The requesting tool waits for this answer. An expired request can’t be answered.',decision([['include','Include'],['decline','Decline'],['expire','Preview expiry']]));
        if(kind==='delegate') return box('branch','Scout · Research agent',answer?'Checked both pilot notes':'Checking both pilot notes',answer?'Both teams reported friction with invitations.':'Scout is comparing the two teams’ findings for Chief.',answer?receipt('Completed'):picks([['finish','Preview result']]));
        if(kind==='relay') return box('branch','Group conversation','Chief handed this to Scout','“Compare the two pilot reports and send me the common issues.”',receipt('Conversation continues with Scout'));
        if(kind==='call') return box('phone','Voice call','Chief is calling','Talk through the pilot decision before the review.',answer?receipt(answer):picks([['answer','Answer sample call'],['decline','Decline']]));
        if(kind==='chart') return `<div class="request">${head('chart','Chart')}<h3>Pilot setup completion</h3><div class="bar-row">Workspace<span class="bar" aria-hidden="true"><i style="--value:100%"></i></span><b>2/2</b></div><div class="bar-row">Invite<span class="bar" aria-hidden="true"><i style="--value:0%"></i></span><b>0/2</b></div><div class="chart-note">Teams completing each step without help</div></div>`;
        if(kind==='card') return `<div class="request">${head('layers','Summary')}<h3>Pilot follow-up</h3><dl class="keys"><dt>Owner</dt><dd>Maya</dd><dt>Checkpoint</dt><dd>Friday</dd><dt>Teams</dt><dd>2</dd></dl></div>`;
        return box('circle','Action · '+(answer?'Completed':'Failed'),answer?'Read the team notes':'Couldn’t open the notes',answer?'The sample retry succeeded.':'The review file was unavailable. No brief was saved.',answer?receipt('Completed on retry'):picks([['recover','Retry sample action']]));
      }
      function library(){showSheet('Message types',`<p class="sheet-intro">Other messages Chief can send. Try a state here without changing the conversation.</p><label class="picker-label" for="example-picker">Message type</label><select id="example-picker">${Object.entries(examples).map(([key,label])=>`<option value="${key}" ${key===state.sample?'selected':''}>${label}</option>`).join('')}</select><div id="example" class="sample">${example()}</div>`,'library')}
      const answers={'opt-team':'Answered · Pilot team','opt-leads':'Answered · Team leads',allow:'Routine saved in this sample',decline:'Declined',connect:'Connected in this sample',include:'Accepted · Include archived reviews',expire:'Expired · No response sent',finish:'Completed',answer:'Answered · Sample call ended',recover:'Completed on retry'};
      document.addEventListener('click',event=>{
        const button=event.target.closest('button');if(!button)return;
        if(button.dataset.phase){const phase=button.dataset.phase;if(phase==='ready' && state.phase!=='ready'){state.handoff='selected';state.file='Final notes'}phaseTo(phase);return}
        if(button.id==='library'){library();return}if(button.id==='replay'){replay();return}
        const cmd=button.dataset.cmd;
        if(cmd==='stop'){state.stoppedAt=state.phase;phaseTo('stopped');byId('stage').querySelector('button').focus({preventScroll:true})}
        if(cmd==='retry'){phaseTo(state.stoppedAt);byId('stage').focus({preventScroll:true})}
        if(cmd==='computer')computer();if(cmd==='close')closeSheet();if(cmd==='page')page();
        if(cmd==='skip'||cmd==='use-file'){state.handoff=cmd==='skip'?'skipped':'selected';if(cmd==='use-file')state.file=byId('sheet-body').querySelector('input:checked').value;closeSheet();phaseTo('ready');byId('stage').focus({preventScroll:true})}
        if(Object.hasOwn(answers,cmd)){state.answers[state.sample]=answers[cmd];byId('example').innerHTML=example();byId('example-picker').focus({preventScroll:true});byId('announce').textContent=answers[cmd]}
      });
      byId('sheet-body').addEventListener('change',event=>{if(event.target.id==='example-picker'){state.sample=event.target.value;byId('example').innerHTML=example()}});
      byId('tabs').addEventListener('keydown',event=>{const index=tabs.indexOf(event.target);if(index<0)return;const next={ArrowRight:(index+1)%4,ArrowLeft:(index+3)%4,Home:0,End:3}[event.key];if(next===undefined)return;event.preventDefault();phaseTo(phases[next],true)});
      render(false);
    })();
  </script>
</body>
</html>

name: RakazoNative
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  SWIFT_VERSION: '5.0'
  DEVELOPMENT_LANGUAGE: en
targets:
  RakazoNative:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - path: Resources/Brandmarks
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Rakazo Native
        PRODUCT_BUNDLE_IDENTIFIER: dev.rakazo.nativeclient
        'PRODUCT_NAME[sdk=macosx*]': Rakazo Mac
        'PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]': dev.rakazo.nativeclient.macpreview
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        'CODE_SIGN_ENTITLEMENTS[sdk=macosx*]': Config/RakazoMac.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rakazo Native
        'INFOPLIST_KEY_CFBundleDisplayName[sdk=macosx*]': Rakazo Mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        'ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]': MacIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
      configs:
        Release:
          'CODE_SIGN_INJECT_BASE_ENTITLEMENTS[sdk=macosx*]': NO
          'ENABLE_HARDENED_RUNTIME[sdk=macosx*]': YES
  RakazoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RakazoNative
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.rakazo.nativeclient.uitests
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTS_MACCATALYST: NO
  RakazoMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacUITests]
    dependencies:
      - target: RakazoNative
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.rakazo.nativeclient.macpreview.uitests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  RakazoMac:
    build:
      targets:
        RakazoNative: all
    test:
      targets: [RakazoMacUITests]
  RakazoNative:
    build:
      targets:
        RakazoNative: all
    test:
      targets: [RakazoUITests]
